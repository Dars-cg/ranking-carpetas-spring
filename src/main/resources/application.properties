# Nombre de la aplicación
spring.application.name=ranking-carpetas

# Configuración de Base de Datos H2 Local (guarda en la carpeta ./data del proyecto)
spring.datasource.url=jdbc:h2:file:./data/rankingdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA / Hibernate (Crea y actualiza la tabla automáticamente)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Habilitar consola web de H2 (Accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Límite de tamaño para subir archivos ZIP (por defecto Spring solo permite 1MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB